# Run config it.judges; writes to data/runs/italian.
data_dir: data/runs/italian
item_bank: data/items_it.yaml

samples: 3
temperature: 0.7
blind_seed: 0
bootstrap: 2000

models: []

judges:  # 3-lab panel, Italian rubric — symmetric cross-lab de-confound (matches English)
  - {judge_model: claude-opus-4-8-api, model: claude-opus-4-8, provider: anthropic, language: it}
  - {judge_model: claude-sonnet-4-6, provider: anthropic, language: it}
  - {judge_model: gpt-5.5, provider: openai, language: it}
  - {judge_model: gemini-3.1-pro-preview, provider: google, language: it}
  - {judge_model: gemma4:26b, provider: ollama, language: it}
