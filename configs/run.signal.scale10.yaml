# Run config signal.scale10; writes to data/runs/signal.
data_dir: data/runs/signal
item_bank: data/items.yaml

samples: 3
temperature: 0.7
blind_seed: 0
bootstrap: 2000

models: []

judges:  # cross-lab panel, scale 10, distinct -s10 labels (pairs against the 0-5 panel)
  - judge_model: claude-opus-4-8-api-s10
    model: claude-opus-4-8
    provider: anthropic
    scale: 10
  - judge_model: claude-sonnet-4-6-s10
    model: claude-sonnet-4-6
    provider: anthropic
    scale: 10
  - judge_model: gpt-5.5-s10
    model: gpt-5.5
    provider: openai
    scale: 10
