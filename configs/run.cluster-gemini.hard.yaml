# Run config cluster-gemini.hard; writes to data/runs/cluster-gemini-hard.
data_dir: data/runs/cluster-gemini-hard
item_bank: data/items_hard.yaml

samples: 3
temperature: 0.7          # provenance of the frozen generations; judge temp is 0.0 in-script
blind_seed: 0
bootstrap: 2000

models:
  - {name: claude-opus-4-8, provider: anthropic}
  - {name: claude-sonnet-4-6, provider: anthropic}
  - {name: gpt-5.5, provider: openai}

judges:
  - {judge_model: gemini-3.1-pro-preview, provider: google}
