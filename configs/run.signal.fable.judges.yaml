# Run config signal.fable.judges; writes to data/runs/signal_fable.
data_dir: data/runs/signal_fable
item_bank: data/items.yaml

samples: 3
temperature: 0.7
blind_seed: 0
bootstrap: 2000

models: []

judges:
  - judge_model: claude-opus-4-8-api   # distinct label; calls the real model below
    model: claude-opus-4-8
    provider: anthropic
  - judge_model: claude-sonnet-4-6
    provider: anthropic
  - judge_model: gpt-5.5
    provider: openai
  - judge_model: gemini-3.1-pro-preview   # neutral lineage; no same-lab bias for an Anthropic model
    provider: google
