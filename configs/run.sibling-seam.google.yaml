# Run config sibling-seam.google; writes to data/runs/sibling-seam-google.
data_dir: data/runs/sibling-seam-google
item_bank: data/items.yaml

samples: 3
temperature: 0.7          # provenance of the copied generations; judges are called at 0.0 in-script
blind_seed: 0
bootstrap: 2000

models:
  - {name: gpt-5.5, provider: openai}
  - {name: gpt-5.4-mini, provider: openai}
  - {name: gpt-oss:20b, provider: ollama}
  - {name: claude-opus-4-8, provider: anthropic}
  - {name: claude-sonnet-4-6, provider: anthropic}
  - {name: claude-haiku-4-5-20251001, provider: anthropic}
  - {name: gemini-3.1-pro-preview, provider: google}
  - {name: gemini-3.5-flash, provider: google}
  - {name: gemini-3.1-flash-lite, provider: google}
  - {name: gemma4:e4b, provider: ollama}
  - {name: llama3.2:3b, provider: ollama}

judges:
  - {judge_model: gemini-3.6-flash, provider: google}
