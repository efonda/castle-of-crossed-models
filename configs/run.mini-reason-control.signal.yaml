# Run config mini-reason-control.signal; writes to data/runs/mini-reason-control-signal.
data_dir: data/runs/mini-reason-control-signal
item_bank: data/items.yaml
samples: 3
temperature: 0.7
blind_seed: 0
bootstrap: 2000

models:
  - {name: gpt-5.5-noreason, provider: openai, model: gpt-5.5, conditions: [normal]}

judges:
  - {judge_model: grok-4.3, provider: xai}
  - {judge_model: qwen3.7-max, provider: openrouter, model: qwen/qwen3.7-max, scale: 5}
  - {judge_model: gemini-3.1-pro-preview, provider: google}
