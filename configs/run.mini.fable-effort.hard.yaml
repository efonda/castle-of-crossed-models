# Run config mini.fable-effort.hard; writes to data/runs/mini-fable-effort-hard.
data_dir: data/runs/mini-fable-effort-hard
item_bank: data/items_hard.yaml

samples: 3
temperature: 0.7          # recorded as requested only; IGNORED on the thinking path (adaptive
blind_seed: 0
bootstrap: 2000

models:
  - {name: claude-fable-5-elow, model: claude-fable-5, provider: anthropic, conditions: [thinking], effort: low}

judges:
  - {judge_model: grok-4.3, provider: xai}
  - {judge_model: qwen3.7-max, provider: openrouter, model: qwen/qwen3.7-max}
  - {judge_model: gemini-3.1-pro-preview, provider: google}
