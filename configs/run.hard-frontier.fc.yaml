# Run config hard-frontier.fc; writes to data/runs/hard_frontier.
data_dir: data/runs/hard_frontier
item_bank: data/items_hard.yaml

samples: 3
temperature: 0.7
blind_seed: 0
bootstrap: 2000

models:
  - {name: claude-opus-4-8, provider: anthropic}
  - {name: claude-sonnet-4-6, provider: anthropic}
  - {name: gpt-5.5, provider: openai}

judges:
  - {judge_model: grok-4.3, provider: xai}
  - {judge_model: qwen3.7-max, provider: openrouter, model: qwen/qwen3.7-max}
